[package]
name = "quran"
version = "0.1.0"
edition = "2024"
description = "Print Quranic text for a reference query"
license = "CC0-1.0 AND CC-BY-3.0"
repository = "https://github.com/hatimthayyil/quran"
readme = "../../README.md"
keywords = ["quran", "arabic", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
roxmltree = "0.21.1"
thiserror = "2"
winnow = "1"

[dev-dependencies]
assert_cmd = "2.2.2"
sha2 = "0.11.0"
